name: Roll20 browser multiplayer acceptance
on:
  push:
    branches: [main, test/v113-two-browser-acceptance]
    paths:
      - 'tabletop.js'
      - 'roll20-shell.js'
      - 'index.html'
      - 'tests/roll20-browser.spec.cjs'
      - '.github/workflows/roll20-browser.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tabletop.js'
      - 'roll20-shell.js'
      - 'index.html'
      - 'tests/roll20-browser.spec.cjs'
      - '.github/workflows/roll20-browser.yml'
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner and Chromium
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve checked-out tabletop
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tabletop-server.log 2>&1 &
          echo $! > /tmp/tabletop-server.pid
          for x in $(seq 1 30); do if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi; sleep 1; done
      - name: Test sidebar and multiplayer privacy
        run: npx playwright test tests/roll20-browser.spec.cjs --reporter=line --workers=1
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roll20-browser-failure
          path: test-results/
          if-no-files-found: ignore
